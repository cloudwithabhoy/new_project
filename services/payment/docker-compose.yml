# Local development only — NOT used in Kubernetes.
# Brings up Postgres + the payment service so you can exercise the mock
# authorizer (and flip FAIL_MODE to demo declines / errors) locally.
#
#   docker compose up --build
#   # approve a payment
#   curl -X POST localhost:8087/payments \
#     -H 'Content-Type: application/json' \
#     -d '{"order_id":1,"user_id":42,"amount_cents":2598}'
#   # fetch it back
#   curl localhost:8087/payments/1
#
#   # to demo a decline / error, set FAIL_MODE below to "decline" or "error"
#   # and re-run `docker compose up --build`.
services:
  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5437:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 3s
      retries: 5

  payment:
    build: .
    environment:
      PORT: "8087"
      LOG_LEVEL: info
      DB_HOST: payment-postgres
      DB_PORT: "5432"
      DB_USER: payment
      DB_PASSWORD: payment
      DB_NAME: payment
      DB_SSLMODE: disable
      FAIL_MODE: "off"   # off | decline | error
    ports:
      - "8087:8087"
    depends_on:
      payment-postgres:
        condition: service_healthy

volumes:
  payment_pgdata:

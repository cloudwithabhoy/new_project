# Local development only — NOT used in Kubernetes.
# Brings up Postgres + auth + the user service together so you can exercise the
# full registration flow (auth -> user) locally.
#
#   docker compose up --build
#   curl -X POST localhost:8081/register \
#     -H 'Content-Type: application/json' \
#     -d '{"email":"a@b.com","password":"supersecret","full_name":"Ada Lovelace"}'
#   curl -X POST localhost:8081/login \
#     -H 'Content-Type: application/json' \
#     -d '{"email":"a@b.com","password":"supersecret"}'
services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_svc
      POSTGRES_DB: users
    ports:
      - "5434:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  user:
    build: ../user
    environment:
      PORT: "8082"
      LOG_LEVEL: info
      DB_HOST: user-postgres
      DB_PORT: "5432"
      DB_USER: user_svc
      DB_PASSWORD: user_svc
      DB_NAME: users
      DB_SSLMODE: disable
    ports:
      - "8082:8082"
    depends_on:
      user-postgres:
        condition: service_healthy

  auth:
    build: .
    environment:
      PORT: "8081"
      LOG_LEVEL: info
      DB_HOST: auth-postgres
      DB_PORT: "5432"
      DB_USER: auth
      DB_PASSWORD: auth
      DB_NAME: auth
      DB_SSLMODE: disable
      USER_URL: http://user:8082
      # JWT_PRIVATE_KEY_PEM left empty -> ephemeral dev key (fine for local).
      JWT_ISSUER: auth.ecommerce.local
      JWT_AUDIENCE: ecommerce
      JWT_TTL_MINUTES: "60"
    ports:
      - "8081:8081"
    depends_on:
      auth-postgres:
        condition: service_healthy
      user:
        condition: service_started

volumes:
  auth_pgdata:
  user_pgdata:

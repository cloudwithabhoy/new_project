# Local development only — NOT used in Kubernetes.
# Spins up a single-node Redpanda (Kafka API) + the thumbnail-job worker so you
# can test the consumer end to end and generate load with producer.py.
#
#   docker compose up --build
#   # in another shell, push a burst and watch the worker's logs:
#   KAFKA_BROKERS=localhost:9092 python producer.py 500
#   curl localhost:9100/healthz
#   curl localhost:9100/metrics | grep thumbnails_processed_total
services:
  redpanda:
    # Redpanda is a drop-in Kafka API; lighter than the full Kafka+ZooKeeper combo.
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  thumbnail-job:
    build: .
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: thumbnail.requests
      KAFKA_GROUP: thumbnail
      LOG_LEVEL: info
      METRICS_PORT: "9100"
    ports:
      - "9100:9100"
    depends_on:
      redpanda:
        condition: service_healthy

# Local development only — NOT used in Kubernetes.
# Spins up Postgres + the catalog service so you can test before deploying.
#
#   docker compose up --build
#   curl localhost:8083/healthz
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build: .
    environment:
      PORT: "8083"
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: catalog
      DB_PASSWORD: catalog
      DB_NAME: catalog
      DB_SSLMODE: disable
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  catalog_pgdata:

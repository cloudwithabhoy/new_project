# Local development only — NOT used in Kubernetes.
# Brings up Redis + catalog (+ its Postgres) + cart together so you can exercise
# the full add-to-cart flow (cart -> catalog) locally.
#
#   docker compose up --build
#   # seed a product in catalog first
#   curl -X POST localhost:8083/products \
#     -H 'Content-Type: application/json' \
#     -d '{"name":"Widget","description":"a widget","price_cents":1299,"stock":10}'
#   # add it to a cart (cart validates it against catalog)
#   curl -X POST localhost:8085/carts/42/items \
#     -H 'Content-Type: application/json' \
#     -d '{"product_id":1,"quantity":2}'
#   curl localhost:8085/carts/42
services:
  cart-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5435:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build: ../catalog
    environment:
      PORT: "8083"
      LOG_LEVEL: info
      DB_HOST: catalog-postgres
      DB_PORT: "5432"
      DB_USER: catalog
      DB_PASSWORD: catalog
      DB_NAME: catalog
      DB_SSLMODE: disable
    ports:
      - "8083:8083"
    depends_on:
      catalog-postgres:
        condition: service_healthy

  cart:
    build: .
    environment:
      PORT: "8085"
      LOG_LEVEL: info
      REDIS_ADDR: cart-redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CATALOG_URL: http://catalog:8083
    ports:
      - "8085:8085"
    depends_on:
      cart-redis:
        condition: service_healthy
      catalog:
        condition: service_started

volumes:
  catalog_pgdata:

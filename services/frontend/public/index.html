<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — EKS Microservices Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-inner">
        <div class="brand">Shop<span class="brand-badge">EKS</span></div>
        <div class="nav-search" id="nav-search" hidden>
          <input id="search" type="search" placeholder="Search for products, brands and more…" autocomplete="off" />
        </div>
        <div class="nav-account">
          <span id="whoami" class="nav-user">not signed in</span>
          <button id="logout-btn" class="btn-light" type="button" hidden>Log out</button>
        </div>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- AUTH VIEW — shown until the user logs in -->
    <main id="auth-view" class="auth-view">
      <div class="auth-card">
        <h1 class="auth-title">Welcome</h1>
        <p class="auth-sub">Sign in to browse products and place orders.</p>

        <div class="tabs">
          <button id="tab-login" class="tab active" type="button">Log in</button>
          <button id="tab-register" class="tab" type="button">Register</button>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="your password" autocomplete="current-password" />
        </div>
        <div class="field" id="fullname-field" hidden>
          <label for="fullname">Full name</label>
          <input id="fullname" type="text" placeholder="Jane Doe" autocomplete="name" />
        </div>

        <button id="submit-btn" class="btn-primary block" type="button">Log in</button>
      </div>
    </main>

    <!-- APP VIEW — the storefront, shown after login -->
    <main id="app-view" class="app-view" hidden>
      <section class="section">
        <div class="section-head">
          <h2>Products</h2>
          <button id="refresh-products" class="btn-link" type="button">Refresh</button>
        </div>
        <ul id="products" class="product-grid"></ul>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Your orders</h2>
          <button id="refresh-orders" class="btn-link" type="button">Refresh</button>
        </div>
        <ul id="orders" class="order-list"></ul>
      </section>
    </main>

    <footer class="footer"><small>Gateway: <code id="gateway-url">…</code></small></footer>

    <script src="/app.js"></script>
  </body>
</html>

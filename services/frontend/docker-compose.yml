# LOCAL dev only — runs just the frontend.
#
# The frontend has no datastore. It needs the api-gateway running and reachable
# FROM YOUR BROWSER at API_GATEWAY_URL. This compose file does NOT start the
# gateway (that lives with the api-gateway service); bring the gateway up
# separately (e.g. `cd ../api-gateway && docker compose up`) or run it on the
# host, then point API_GATEWAY_URL at it.
#
# Because the browser (not this container) calls the gateway, the default
# http://localhost:8080 assumes the gateway is published on the host's :8080.

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: "info"
      # Browser-reachable gateway URL. Override to your gateway's host URL.
      API_GATEWAY_URL: "http://localhost:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

# Local development only — NOT used in Kubernetes.
# Spins up Postgres + Kafka (Redpanda) + the recommendation service so you can test
# it in isolation. Produce an order.created event by hand to feed the consumer
# (see the README), or run the order service to emit real ones.
#
#   docker compose up --build
#   curl localhost:8090/healthz
#   curl 'localhost:8090/recommendations?user_id=42'
#   curl 'localhost:8090/recommendations?product_id=7'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recommendation
      POSTGRES_PASSWORD: recommendation
      POSTGRES_DB: recommendation
    ports:
      - "5440:5432"
    volumes:
      - recommendation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation:
    build: .
    environment:
      PORT: "8090"
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: recommendation
      DB_PASSWORD: recommendation
      DB_NAME: recommendation
      DB_SSLMODE: disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: order.created
      KAFKA_GROUP: recommendation
      VARIANT: a
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  recommendation_pgdata:

# Local development only — NOT used in Kubernetes.
# Spins up Postgres + Kafka (Redpanda) + the inventory service so you can test both
# the sync API and the async order.created consumer in isolation.
#
#   docker compose up --build
#   curl localhost:8088/healthz
#   # seed stock, then reserve it
#   curl -X PUT localhost:8088/inventory/7 -H 'Content-Type: application/json' -d '{"available":10}'
#   curl -X POST localhost:8088/inventory/reserve -H 'Content-Type: application/json' \
#     -d '{"order_id":1,"items":[{"product_id":7,"quantity":2}]}'
#   curl localhost:8088/inventory/7
#   # emit an order.created event to exercise the consumer (commits the reservation):
#   echo '{"event":"order.created","order_id":1,"user_id":42,"items":[{"product_id":7,"quantity":2,"price_cents":1299}],"total_cents":2598,"created_at":"2026-06-16T12:00:00Z"}' \
#     | docker compose exec -T redpanda rpk topic produce order.created --key 1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5438:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    # Redpanda is a drop-in Kafka API broker — lighter than full Kafka for local dev.
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory:
    build: .
    environment:
      PORT: "8088"
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: inventory
      DB_PASSWORD: inventory
      DB_NAME: inventory
      DB_SSLMODE: disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: order.created
      KAFKA_GROUP: inventory
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  inventory_pgdata:

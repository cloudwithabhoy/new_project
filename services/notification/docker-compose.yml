# Local development only — NOT used in Kubernetes.
# Spins up Redpanda (Kafka-compatible) + the notification service so you can test
# it in isolation.
#
#   docker compose up --build
#   curl localhost:8089/healthz
#   curl localhost:8089/readyz
#
#   # produce a test order.created event (key = order_id):
#   docker compose exec redpanda rpk topic create order.created || true
#   echo '123 {"event":"order.created","order_id":123,"user_id":42,"items":[{"product_id":7,"quantity":2,"price_cents":1299}],"total_cents":2598,"created_at":"2026-06-16T12:00:00Z"}' \
#     | docker compose exec -T redpanda rpk topic produce order.created --format '%k %v\n'
#
#   curl 'localhost:8089/notifications?limit=10'
services:
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    build: .
    environment:
      PORT: "8089"
      LOG_LEVEL: info
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: order.created
      KAFKA_GROUP: notification
      NOTIFICATION_BUFFER: "100"
    ports:
      - "8089:8089"
    depends_on:
      redpanda:
        condition: service_healthy
